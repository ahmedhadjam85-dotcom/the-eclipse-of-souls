<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eclipse of Souls</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ MAIN MENU ============ -->
  <div id="mainMenu" class="screen">
    <h1 class="title">ECLIPSE <span>OF</span> SOULS</h1>
    <button id="newGameBtn" class="menuBtn">New Game</button>
    <span class="studioTag">Ahmed hadjam.games©</span>
  </div>

  <!-- ============ CONTROL SELECT ============ -->
  <div id="controlSelect" class="screen hidden">
    <h2 class="subtitle">Choose Control System </h2>
    <div class="controlOptions">
      <div class="controlBox" data-mode="xbox">
        <div class="controlIcon">🎮</div>
        <span>Xbox</span>
      </div>
      <div class="controlBox" data-mode="phone">
        <div class="controlIcon">📱</div>
        <span>Phone</span>
      </div>
      <div class="controlBox" data-mode="pc">
        <div class="controlIcon">⌨️</div>
        <span>PC</span>
      </div>
    </div>
  </div>

  <!-- ============ GAME SCREEN ============ -->
  <div id="gameScreen" class="screen hidden">

    <!-- HUD -->
    <div id="hud">
      <div id="bossNameTag" class="hidden">
        <span id="bossName"></span>
        <span id="bossTitle"></span>
      </div>
      <div class="hudRow">
        <span class="hudLabel">BOSS</span>
        <div class="barOuter"><div id="bossBar" class="barInner bossFill"></div></div>
      </div>
      <div class="hudRow">
        <span class="hudLabel">ENERGY</span>
        <div class="barOuter"><div id="energyBar" class="barInner energyFill"></div></div>
      </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Touch controls (shown only in phone mode) -->
    <div id="touchControls" class="hidden">
      <div id="dpad">
        <button id="btnUp" class="dpadBtn posUp">▲</button>
        <button id="btnLeft" class="dpadBtn posLeft">◀</button>
        <button id="btnRight" class="dpadBtn posRight">▶</button>
        <button id="btnDown" class="dpadBtn posDown">▼</button>
      </div>
      <div id="attackBtn">ATK</div>
    </div>

    <!-- Chapter transition banner -->
    <div id="chapterBanner" class="hidden">
      <span id="chapterBannerText"></span>
    </div>

    <!-- Dialogue box -->
    <div id="dialogueBox" class="hidden">
      <div id="dialogueSpeaker"></div>
      <div id="dialogueText"></div>
      <div id="dialogueHint">اضغط للمتابعة ▶</div>
    </div>

  </div>

<script src="character.js"></script>
<script src="bosses.js"></script>
<script src="dialog.js"></script>
<script src="music.js"></script>
<script src="game.js"></script>
</body>
</html>
